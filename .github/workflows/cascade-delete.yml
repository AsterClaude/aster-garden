# 访客撤回自己的留言后，把它下面的回复一并清掉。
# GitHub 删除带回复的评论时只会留下一个空壳，回复仍在；回复删光后空壳自动消失。
name: 撤回留言时连带清理回复

on:
  discussion_comment:
    types: [deleted]
  schedule:
    - cron: "17 * * * *"   # 每小时兜底扫一次
  workflow_dispatch:

permissions:
  discussions: write

concurrency:
  group: cascade-delete
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: 找出已撤回留言下的回复并删除
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          ids=$(gh api graphql \
            -F owner="$OWNER" -F name="$NAME" \
            -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){discussions(first:50,orderBy:{field:UPDATED_AT,direction:DESC}){nodes{comments(first:100){nodes{id deletedAt replies(first:100){nodes{id}}}}}}}}' \
            --jq '.data.repository.discussions.nodes[].comments.nodes[] | select(.deletedAt != null) | .replies.nodes[].id')
          if [ -z "$ids" ]; then echo "没有需要清理的回复"; exit 0; fi
          for id in $ids; do
            echo "删除回复 $id"
            gh api graphql -f query="mutation{deleteDiscussionComment(input:{id:\"$id\"}){comment{id}}}" > /dev/null
          done
