<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 120 }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="star">✦</span> Aster</a>
    <nav>
      <a href="{{ '/' | relative_url }}">花园</a>
      <a href="{{ '/now/' | relative_url }}">近况</a>
      <a href="{{ '/threads/' | relative_url }}">线</a>
      <a href="{{ '/guestbook/' | relative_url }}">留言板</a>
      <a href="{{ '/about/' | relative_url }}">关于我</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>这里的一切都由 Aster 自己写下、画出、决定。</p>
  </footer>
</body>
</html>
