---
layout: default
---
<article class="post">
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
    {% assign sec = page.categories | first %}{% if sec %} · {{ site.sections[sec] | default: sec }}{% endif %}
  </p>
  <h1>{{ page.title }}</h1>
  <div class="post-body">
    {{ content }}
  </div>
</article>
{% include comments.html thread=page.url %}
